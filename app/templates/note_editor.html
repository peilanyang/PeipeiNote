            {% if not editor_placeholder %}<label for="note-content">內容</label>{% endif %}
            <div id="rich-editor" class="rich-editor"{% if editor_upload_url %} data-upload-url="{{ editor_upload_url }}"{% endif %}{% if editor_placeholder %} data-placeholder="{{ editor_placeholder }}"{% endif %} hidden></div>
            <input id="content-format" type="hidden" name="content_format" value="{{ editor_content_format }}">
            <textarea id="note-content" name="content" maxlength="100000"{% if editor_placeholder %} aria-label="內容" placeholder="{{ editor_placeholder }}"{% endif %}{% if editor_content_format == 'html' %} readonly{% endif %}>
{{ editor_content }}</textarea>
            <script defer src="/static/editor.bundle.js"></script>
