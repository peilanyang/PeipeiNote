<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ note.title }} | 列印筆記</title>
  <style>
    body { margin: 0; padding: 1.5rem; background: #f4f1f8; color: #292336;
      font: 16px/1.55 "Segoe UI", "Microsoft JhengHei", sans-serif; }
    article { max-width: 48rem; margin: auto; background: white; padding: clamp(1rem, 4vw, 2.75rem);
      overflow-wrap: anywhere; }
    .print-actions { max-width: 48rem; margin: 0 auto 1rem; display: flex; align-items: center; gap: 1rem; }
    .print-actions a { color: #60418b; }
    .print-actions button { font: inherit; color: white; background: #60418b; border: 0;
      border-radius: 7px; padding: .5rem .85rem; cursor: pointer; }
    .note-title { margin: 0 0 1rem; }
    .plain { white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #aaa; padding: .35rem .5rem; vertical-align: top; }
    th { background: #f4f1f8; }
    tr, img { break-inside: avoid; }
    thead { display: table-header-group; }
    img { display: block; max-width: 100%; height: auto; margin-block: .5rem; }
    ul[data-type=taskList] { list-style: none; padding-left: 1.3rem; }
    li[data-type=taskItem] { position: relative; }
    li[data-type=taskItem]::before { position: absolute; left: -1.3rem; content: "☐"; }
    li[data-checked=true]::before { content: "☑"; }
    li[data-checked=true] > div { text-decoration: line-through; }
    pre { white-space: pre-wrap; }
    h1, h2, h3 { break-after: avoid-page; }
    @page { margin: 16mm; }
    @media print {
      body { padding: 0; background: white; color: black; font-size: 11pt; }
      article { max-width: none; padding: 0; }
      .print-actions { display: none !important; }
    }
  </style>
  <script defer src="/static/print-note.js"></script>
</head>
<body>
  <nav class="print-actions" aria-label="列印操作">
    <a href="/?kind=note&amp;item_id={{ note.id }}">返回筆記</a>
    <button type="button" id="print-note">列印／另存 PDF</button>
  </nav>
  <article>
    <h1 class="note-title">{{ note.title }}</h1>
    {% if rich %}<div>{{ body|safe }}</div>{% else %}<div class="plain">{{ body }}</div>{% endif %}
  </article>
</body>
</html>
