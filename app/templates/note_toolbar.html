<div id="rich-toolbar" class="rich-toolbar" role="group" aria-label="文字格式" hidden>
  <div class="toolbar-group">
    <select aria-label="段落樣式">
      <option value="0">純文字</option>
      <option value="1">標題 1</option>
      <option value="2">標題 2</option>
      <option value="3">標題 3</option>
    </select>
    <button type="button" data-command="toggleBold" aria-pressed="false"><strong>粗體</strong></button>
    <button type="button" data-command="link">連結</button>
  </div>
  <div class="toolbar-group">
    <button type="button" data-command="toggleTaskList" aria-pressed="false">待辦清單</button>
    <button type="button" data-command="insertTable">插入表格</button>
    <button type="button" data-command="setHorizontalRule">分隔線</button>
  </div>
  {% if editor_upload_url %}
  <div class="toolbar-group" id="attachment-picker" hidden>
    <button type="button" id="choose-attachments">上傳附件</button>
    <input type="file" id="attachment-input" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.docx,.txt,.zip" multiple hidden>
  </div>
  {% endif %}
  <div class="toolbar-group table-tools" data-table-tools role="group" aria-label="表格操作" hidden>
    <button type="button" data-command="addRowAfter">加一列</button>
    <button type="button" data-command="deleteRow">刪除列</button>
    <button type="button" data-command="addColumnAfter">加一欄</button>
    <button type="button" data-command="deleteColumn">刪除欄</button>
    <button type="button" data-command="deleteTable">刪除表格</button>
  </div>
  {% if editor_upload_url %}<p class="attachment-status" id="attachment-status" role="status"></p>{% endif %}
</div>
