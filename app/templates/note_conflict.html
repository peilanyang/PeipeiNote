<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>筆記儲存衝突 | PeipeiNote</title></head>
<body>
  <h1>其他分頁已儲存新版</h1>
  <p>請先複製下面的草稿，再開啟最新版本並合併修改。</p>
  <label>草稿標題 <input readonly value="{{ title }}"></label>
  <p><label>草稿內容<br><textarea readonly rows="14" cols="72">{{ draft }}</textarea></label></p>
  <a href="{{ note_url }}" target="_blank" rel="noopener">在新分頁開啟最新版本</a>
</body>
</html>
