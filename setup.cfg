# PeipeiNote project settings: PEP8 style rules (pycodestyle reads setup.cfg or tox.ini).
# NOTE: keep this file pure ASCII - configparser on Windows reads it with the
# locale default encoding (cp950), which crashes on UTF-8 CJK characters.
# max-line-length is 120 because the codebase contains many CJK strings and SQL
# literals; PEP 8 explicitly allows teams to choose a longer line length.
[pycodestyle]
max-line-length = 120
